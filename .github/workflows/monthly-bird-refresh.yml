name: Monthly State-Park Bird Refresh

# Re-samples the county bird-frequency dataset (eBird historical checklists)
# that powers state-park rarity, then regenerates the per-state lazy chunks.
#
# The county cache (scripts/_nj_county_cache/) has NO TTL — the build treats
# cached counties as final — so a genuine refresh must clear it first. A full
# re-sample of ~1,400 counties runs ~3-5h, inside the 6h job budget. Previously
# this only ever ran manually on a laptop (with a sleep-suppressor wrapper);
# this workflow removes that bottleneck.
#
# Manual trigger: Actions tab → "Run workflow".

on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      full_clear:
        description: "Clear the ENTIRE county cache (will very likely exceed the 350min budget — only for a deliberate full rebuild)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Rotate, don't wipe. Clearing the WHOLE cache made this job re-sample
      # ~1,800 counties, which overran timeout-minutes: 350 every single run
      # (Jul 1 and Aug 1 2026 both cancelled at 5h50m, mid-rebuild) and threw
      # away every hour of it — the cache is only committed at the end, so a
      # cancelled run leaves nothing behind. GitHub's hard cap is 360 minutes,
      # so a bigger timeout was never available.
      #
      # Instead clear one deterministic quarter per month: every county is
      # refreshed on a rolling 4-month cycle, and each run finishes well inside
      # the budget. Bucketing is by a stable hash of the filename (NOT mtime —
      # a fresh checkout gives every file the same timestamp).
      # The cache filename now carries the YEAR it sampled, so nothing needs
      # clearing. This step used to delete a quarter of it (~465 counties) on
      # the theory that "clearing IS the refresh" — but the sample is pinned to
      # getFullYear() - 1, a CLOSED year, so every one of those counties was
      # re-fetched to produce byte-identical data. At ~2.7 min per county that
      # is ~21 hours against timeout-minutes: 350, which is why this job had
      # never completed once: Jul 1, Aug 1 and Sep 1 all cancelled at 5h50m.
      #
      # With the year in the key, a run inside the same year is all cache hits
      # and finishes in seconds. When the year rolls over the keys miss on
      # their own, counties fall back to the previous year's sample (so the
      # build stays complete), and MAX_NEW_SAMPLES upgrades a slice per run
      # rather than attempting all 1,863 at once — that would be ~84 hours.
      - name: County cache status
        run: |
          mkdir -p scripts/_nj_county_cache
          node -e '
            const fs = require("fs");
            const dir = "scripts/_nj_county_cache";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".json"));
            const year = new Date().getFullYear() - 1;
            const current = files.filter(f => f.endsWith(`_${year}.json`)).length;
            console.log(`${files.length} cached counties, ${current} sampled for ${year}`);
            console.log(current === files.length
              ? "All current — this run should be cache-only."
              : `${files.length - current} on an older sample; up to MAX_NEW_SAMPLES will upgrade.`);
          '

      - name: Rebuild county bird frequencies
        env:
          # ~2.7 min/county measured; 110 fits the 350-min job with room for
          # checkout, npm ci, split, build and audits.
          MAX_NEW_SAMPLES: "110"
          VITE_EBIRD_API_KEY: ${{ secrets.EBIRD_KEY }}
          EBIRD_KEY:          ${{ secrets.EBIRD_KEY }}
        run: node --max-old-space-size=6144 scripts/buildStateParkBirdFreq.js

      - name: Split into per-state chunks
        run: node scripts/splitBirdFreq.mjs

      - name: Sanity check (refuse to ship a broken/empty dataset)
        run: |
          node --input-type=module -e "
            import('./src/data/stateParkBirdFreq.js').then(m => {
              const counties = Object.keys(m.COUNTY_BIRD_FREQ).length;
              const parks = Object.keys(m.PARK_COUNTY).length;
              console.log(\`parks=\${parks} counties=\${counties}\`);
              if (parks < 3500 || counties < 1100) { console.error('Dataset suspiciously small — aborting'); process.exit(1); }
            });
          "
          test "$(ls src/data/birdFreq/freq_*.js | wc -l)" = "50" || { echo "Expected 50 state chunks"; exit 1; }

      - name: Health audit (coverage + signature species — refuse a regression)
        run: node --max-old-space-size=6144 scripts/auditSpeciesFloors.mjs

      - name: Build (must pass before pushing)
        env:
          VITE_EBIRD_API_KEY: ${{ secrets.EBIRD_KEY }}
          VITE_NPS_API_KEY:   ${{ secrets.NPS_KEY }}
          # Prerendering 17,468 pages over 35 MB of cache needs the same heap
          # headroom every other heavy step in this pipeline already asks for.
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/stateParkBirdFreq.js src/data/birdFreq/ scripts/_nj_county_cache/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore(data): monthly state-park bird-frequency refresh"
            git push
          fi
