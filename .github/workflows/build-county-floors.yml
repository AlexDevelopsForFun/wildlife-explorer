name: Build County Species Floors

# Builds the NON-BIRD county floor (mammals/reptiles/amphibians/fish/insects)
# from iNaturalist so every park shows its full, range-appropriate animal list.
#
# Runs on a cloud runner (the laptop kept getting its background process
# reclaimed). RESUMABLE: scripts/_nonbird_cache/ is committed, so each run skips
# the counties already sampled and only does the rest — and commits the updated
# cache back, so progress is never lost even if a run is cut short.
#
# A single worker is used on purpose: iNaturalist throttles >60 req/min, and two
# workers got rate-limited into a crawl that blew the 6h budget. One paced worker
# runs at full speed under the limit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nonbird:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/state-parks

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build county non-bird floor (iNaturalist)
        env:
          NPS_API_KEY:      ${{ secrets.NPS_KEY }}
          VITE_NPS_API_KEY: ${{ secrets.NPS_KEY }}
        run: node --max-old-space-size=6144 scripts/buildCountyNonbird.mjs

      - name: Sanity check — Florida must have gators
        run: |
          node --input-type=module -e "
            import('./src/data/countyNonbird/nb_fl.js').then(m => {
              const counties = Object.keys(m.COUNTY_NONBIRD).length;
              const gator = Object.values(m.COUNTY_NONBIRD).some(g => (g.reptile||[]).some(([n]) => /alligator/i.test(n)));
              console.log('FL non-bird counties=' + counties + ' gatorSomewhere=' + gator);
              if (counties < 30 || !gator) { console.error('FL non-bird data looks wrong — aborting'); process.exit(1); }
            });
          "

      - name: Commit data + updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/countyNonbird/ scripts/_nonbird_cache/ || true
          git commit -m "data: county non-bird species floor (resumable build) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin feature/state-parks || true
          git push origin HEAD:feature/state-parks
