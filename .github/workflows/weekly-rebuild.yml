name: Weekly Wildlife Cache Rebuild

# Refreshes the static wildlife cache every Sunday at 06:00 UTC.
#
# Architecture: GitHub Actions caps standard runners at 6h per job, but a full
# rebuild from eBird + iNaturalist + NPS takes longer than that. So the work
# is fanned out across N parallel "rebuild" shards (each gets its own 6h
# budget), then a single "merge" job stitches the partial caches together,
# enriches descriptions, expands photos, validates, and pushes to main.
# Vercel auto-deploys on push.
#
# Manual trigger: Actions tab → "Run workflow" (option to force PR mode).

on:
  schedule:
    - cron: "0 6 * * 0"   # every Sunday 06:00 UTC
  workflow_dispatch:       # manual trigger
    inputs:
      parks:
        description: "Comma-separated park IDs to rebuild (leave blank for full)"
        required: false
        default: ""
      skip_enrich:
        description: "Skip slow description enrichment step"
        required: false
        type: boolean
        default: false
      pr_mode:
        description: "Open a PR instead of pushing to main (override auto-merge)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  # Number of parallel rebuild shards. Each shard gets ~1/N of parks (stride
  # interleaved) and its own 6h GH Actions budget. With ~63 parks total, 4
  # shards = ~16 parks each, which fits comfortably under the cap.
  SHARD_COUNT: "4"

jobs:
  # ── Stage 0: pre-flight curation gate ──────────────────────────────────
  # Fails fast if hand-curated rarity overrides have gone stale. Cheap to run
  # and prevents wasting 4×350 minutes of shard time on a build that would
  # ship known-stale overrides.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check rarity-override curation freshness
        run: node scripts/checkOverrideExpiry.js

  # ── Stage 1: parallel rebuild shards ────────────────────────────────────
  rebuild:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 350     # leave headroom under GH's 360min hard cap
    strategy:
      fail-fast: false       # one shard failing shouldn't kill the others
      matrix:
        shard: [0, 1, 2, 3]  # MUST match SHARD_COUNT above

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild wildlife cache (shard ${{ matrix.shard }}/${{ env.SHARD_COUNT }})
        env:
          # buildWildlifeCache.js reads VITE_* prefixed names (matching .env);
          # provide both naming conventions so either secret name works.
          VITE_EBIRD_API_KEY: ${{ secrets.EBIRD_KEY }}
          VITE_NPS_API_KEY:   ${{ secrets.NPS_KEY }}
          EBIRD_KEY:          ${{ secrets.EBIRD_KEY }}
          NPS_KEY:            ${{ secrets.NPS_KEY }}
          PARKS:              ${{ github.event.inputs.parks }}
          SHARD_INDEX:        ${{ matrix.shard }}
          SHARD_COUNT:        ${{ env.SHARD_COUNT }}
          PARTIAL_OUT:        shard-${{ matrix.shard }}.json
        run: node scripts/buildWildlifeCache.js

      - name: Upload shard cache
        uses: actions/upload-artifact@v5
        with:
          name: cache-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  # ── Stage 2: merge shards, enrich, validate, deploy ─────────────────────
  merge:
    needs: rebuild
    runs-on: ubuntu-latest
    # Photo expansion processes ~600 species and is the slow step (rate-limited
    # third-party photo APIs). Combined with description enrichment + build,
    # this can run 2-3h. Use the same 350min cap as shards (just under GH's
    # 360min hard limit per job).
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Snapshot the current species count so we can verify the rebuild
      # didn't accidentally wipe out a chunk of data (e.g. eBird API outage).
      - name: Snapshot pre-rebuild species count
        id: pre_count
        run: |
          PRE=$(grep -h '"scientificName"' src/data/wildlifeCache*.js 2>/dev/null | wc -l)
          echo "pre=$PRE" >> "$GITHUB_OUTPUT"
          echo "Pre-rebuild species entries: $PRE"

      - name: Download all shard caches
        uses: actions/download-artifact@v5
        with:
          path: shards/
          pattern: cache-shard-*
          merge-multiple: true

      - name: List downloaded shards
        run: ls -la shards/

      - name: Merge shard caches
        run: node scripts/mergeShards.js shards/

      - name: Split primary / secondary caches
        run: node scripts/splitCache.js

      # Both enrichment + photo expansion are time-budget-aware: when the
      # MAX_MINUTES budget is exceeded they save progress (description cache,
      # photo cache, partial wildlifeCache.js) and exit gracefully. Subsequent
      # weekly runs pick up where this run stopped — descriptions are
      # species-shared, photos are species-shared, so cumulative progress
      # across runs converges quickly. Budgets sized to leave ~30min headroom
      # under the 350min job cap for build + validate + commit.
      - name: Enrich placeholder descriptions
        if: ${{ github.event.inputs.skip_enrich != 'true' }}
        continue-on-error: true
        env:
          MAX_MINUTES: "150"
        run: node scripts/enrichDescriptions.js

      - name: Expand bundled photos
        continue-on-error: true
        env:
          MAX_MINUTES: "150"
        run: node scripts/expandPhotos.mjs

      - name: Verify production build
        run: npm run build

      # Anchor-based calibration check — non-blocking. Compares the rebuilt
      # cache against scripts/rarityAnchors.json (hand-curated ground-truth
      # encounter probabilities from NPS bus tours, peer-reviewed studies,
      # operational sighting logs). Logs RPS + reliability diagram so we can
      # spot calibration drift across rebuilds without gating deployments.
      # Threshold (mean tier distance > 1.5) is generous; tighten later once
      # baseline metrics stabilize across a few rebuilds.
      - name: Anchor-based calibration report
        continue-on-error: true
        run: node scripts/calibrateAgainstAnchors.js

      # Data-quality audit — non-blocking. Catches silent override failures
      # (overrides that target species missing from the cache), zone-override
      # mismatches, anchor coverage gaps, and species-count anomalies that
      # would otherwise go unnoticed across rebuilds. Surfaces in the workflow
      # log so a curator can investigate. Set STRICT=1 to gate deploys on it.
      - name: Data-quality audit
        continue-on-error: true
        run: node scripts/auditDataQuality.js

      # Sanity check with graceful degradation:
      #   drop ≤10%      → ship (auto-merge to main)
      #   drop 10-25%    → soft-fail (open PR for human review instead)
      #   drop >25%      → hard-fail (likely API outage — abandon run)
      - name: Validate species count
        id: validate
        run: |
          POST=$(grep -h '"scientificName"' src/data/wildlifeCache*.js 2>/dev/null | wc -l)
          PRE=${{ steps.pre_count.outputs.pre }}
          echo "Post-rebuild species entries: $POST"
          echo "post=$POST" >> "$GITHUB_OUTPUT"
          NEEDS_REVIEW=false
          DROP_PCT=0
          if [ "$PRE" -gt 0 ]; then
            DROP_PCT=$(awk -v p="$PRE" -v q="$POST" 'BEGIN{printf "%.1f", (p-q)*100/p}')
            echo "Drop: ${DROP_PCT}%"
            if awk -v d="$DROP_PCT" 'BEGIN{exit !(d > 25)}'; then
              echo "::error::Rebuild dropped ${DROP_PCT}% of species (was $PRE, now $POST). Hard-fail — likely API outage."
              exit 1
            fi
            if awk -v d="$DROP_PCT" 'BEGIN{exit !(d > 10)}'; then
              echo "::warning::Rebuild dropped ${DROP_PCT}% of species (was $PRE, now $POST). Soft-fail — opening PR for human review instead of auto-merging."
              NEEDS_REVIEW=true
            fi
          fi
          echo "drop_pct=$DROP_PCT" >> "$GITHUB_OUTPUT"
          echo "needs_review=$NEEDS_REVIEW" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      # Auto-push to main when running on schedule, or when manually
      # triggered without pr_mode. Vercel picks up the push and redeploys.
      # Skipped when validate flagged the rebuild for human review.
      - name: Auto-merge to main (branch-first, PR fallback — never loses the rebuild)
        if: |
          steps.diff.outputs.changed == 'true' &&
          steps.validate.outputs.needs_review != 'true' &&
          github.event.inputs.pr_mode != 'true'
        env:
          PRE:  ${{ steps.pre_count.outputs.pre }}
          POST: ${{ steps.validate.outputs.post }}
          DROP: ${{ steps.validate.outputs.drop_pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage ONLY the auto-generated cache files. Staging all of
          # src/data would also commit the runner's STALE copies of
          # hand-curated files (zoneOverrides.js, missingSpeciesPatches.js,
          # etc.) — the rebuild checked out an old commit and never pulled
          # human commits made during its ~3h runtime. Restricting the add
          # to generated files keeps the rebase below conflict-free.
          git add src/data/wildlifeCache.js \
                  src/data/wildlifeCachePrimary.js \
                  src/data/wildlifeCacheTier2.js \
                  src/data/wildlifeCacheTier3.js
          git commit -m "chore(data): weekly wildlife cache rebuild

          Automated weekly rebuild from eBird + iNaturalist + NPS.
          Pre-rebuild species: $PRE
          Post-rebuild species: $POST
          Net drop: ${DROP}% (sanity-check threshold 10%)"
          REBUILD_SHA="$(git rev-parse HEAD)"

          # ── STEP 1: preserve the result IMMEDIATELY ──────────────────
          # Force-push the rebuild commit to a dedicated bot-owned branch.
          # Single-writer, zero contention — this push ALWAYS succeeds, so
          # the ~3 h result is safe on the remote before we ever race the
          # (continuously-moving) main branch. Runs #10/#11 lost the entire
          # rebuild because there was no such checkpoint.
          git push --force origin "HEAD:refs/heads/automated/cache-rebuild"
          echo "Rebuild preserved on automated/cache-rebuild ($REBUILD_SHA)."

          # ── STEP 2: opportunistic fast-forward of main ───────────────
          # Generous exponential backoff (~10 min total). The rebuild commit
          # touches ONLY generated cache files; human commits touch other
          # files, so the rebase is conflict-free. Reset to REBUILD_SHA each
          # attempt so re-rebasing onto a freshly-moved main is idempotent.
          backoff=5
          for attempt in $(seq 1 12); do
            git reset --hard "$REBUILD_SHA"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Auto-merged rebuilt cache to main (attempt $attempt/12)."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "::warning::main moved (attempt $attempt/12) — retry in ${backoff}s"
            sleep "$backoff"
            if [ "$backoff" -lt 60 ]; then backoff=$(( backoff * 2 )); fi
          done

          # ── STEP 3: race lost → PR fallback (NO data loss, NO re-run) ─
          # main moved faster than ~10 min of retries (e.g. a human pushing
          # continuously during the run). The validated rebuild is safe on
          # automated/cache-rebuild; surface it as a one-click PR instead of
          # failing the job and forcing a 3 h re-run.
          git push --force origin "$REBUILD_SHA:refs/heads/automated/cache-rebuild"
          if gh pr view automated/cache-rebuild --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for automated/cache-rebuild — branch updated in place."
          else
            gh pr create --base main --head automated/cache-rebuild \
              --title "chore(data): weekly wildlife cache rebuild (auto-merge raced out)" \
              --body "Rebuild completed and passed all gates, but \`main\` advanced faster than the ~10 min auto-merge retry window (likely continuous human commits during the ~3 h run). The validated cache is preserved on \`automated/cache-rebuild\` — **merge this PR to ship it; no re-run needed.** Only the 4 generated cache files changed. Species: $PRE → $POST (drop ${DROP}%)." \
              --label automated --label data-refresh
          fi
          echo "Rebuild safe on automated/cache-rebuild + PR open. Zero data loss."
          exit 0

      # Open a PR when (a) explicitly requested via workflow_dispatch, or
      # (b) the species drop is in the soft-fail review band (10–25%).
      - name: Open pull request
        if: |
          steps.diff.outputs.changed == 'true' &&
          (github.event.inputs.pr_mode == 'true' ||
           steps.validate.outputs.needs_review == 'true')
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/weekly-rebuild
          title: "chore(data): weekly wildlife cache rebuild (review needed)"
          commit-message: "chore(data): weekly wildlife cache rebuild"
          body: |
            Automated weekly rebuild — opened as PR instead of auto-merged.

            **Reason:** ${{ steps.validate.outputs.needs_review == 'true' && format('species count dropped {0}% (auto-merge threshold is 10%)', steps.validate.outputs.drop_pct) || 'pr_mode=true requested manually' }}

            - Rebuilt species lists from eBird + iNaturalist + NPS (sharded across ${{ env.SHARD_COUNT }} runners).
            - Enriched placeholder descriptions.
            - Expanded bundled photo coverage.
            - Verified production build passes.
            - Species count: ${{ steps.pre_count.outputs.pre }} → ${{ steps.validate.outputs.post }} (drop ${{ steps.validate.outputs.drop_pct }}%)

            Inspect the diff. If the drop reflects a legitimate cleanup or a recoverable API hiccup, merge. Otherwise close and let next Sunday's run try again.
          labels: |
            automated
            data-refresh
